<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>b0r3d QR</title>
    <meta
      name="description"
      content="Make static QR codes in your browser. What you type is encoded straight into the code, so it never expires."
    />
    <meta property="og:title" content="b0r3d QR" />
    <meta
      property="og:description"
      content="Make static QR codes in your browser. What you type is encoded straight into the code, so it never expires."
    />
    <meta property="og:image" content="https://qr.b0r3d.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://qr.b0r3d.org/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#131313" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="apple-touch-startup-image"
      href="/app_icons/web/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/app_icons/web/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/app_icons/web/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/app_icons/web/splash-2048x2732.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <script>
      // The look before the first paint, so a light page never flashes dark: dark unless the visitor
      // chose light, or chose to follow a device that isn't dark (src/ui/theme.ts keeps it after).
      try {
        var look = localStorage.getItem('dark-mode-preference')
        var light = look === 'light' || (look === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p class="noscript">b0r3d QR needs JavaScript: the codes are made in your browser.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
